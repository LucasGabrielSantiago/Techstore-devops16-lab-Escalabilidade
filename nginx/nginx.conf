# ==========================================
# Nginx - load balancer da TechStore
# ==========================================
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # DNS interno do Docker. "valid=5s" faz o Nginx reconsultar o nome "app"
    # a cada 5s, então réplicas adicionadas/removidas com --scale entram e saem
    # do balanceamento SEM reiniciar o Nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Log mostrando qual réplica (upstream) atendeu cada requisição
    log_format lb '$remote_addr "$request" $status '
                  'upstream=$upstream_addr tempo=$request_time';
    access_log /dev/stdout lb;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;

        # Usar variável obriga o Nginx a resolver o DNS em tempo de execução
        # (com "upstream" fixo, ele resolveria só uma vez, na inicialização)
        set $api http://app:3000;

        # Frontend estático (HTML/CSS/JS) servido direto pelo Nginx
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # API: balanceada entre as réplicas
        location /api/ {
            proxy_pass $api;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Se uma réplica cair no meio do caminho, tenta outra
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;

            # Cabeçalho de debug: IP:porta da réplica que respondeu
            add_header X-Upstream $upstream_addr always;
        }
    }
}
