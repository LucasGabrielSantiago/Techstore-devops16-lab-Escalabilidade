<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TechStore — Criar conta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="frame">

  <section class="brand">
    <svg class="ribbon-glyph" viewBox="0 0 400 400" aria-hidden="true">
      <path d="M60,90 C220,90 180,190 340,190" fill="none" stroke="var(--blue-bright)" stroke-width="2" stroke-linecap="round" opacity=".55"/>
      <path d="M40,210 C210,210 170,310 330,310" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".22"/>
      <path d="M90,150 C240,150 210,250 360,250" fill="none" stroke="var(--blue-deep)" stroke-width="2" stroke-linecap="round" opacity=".4"/>
    </svg>

    <div class="brand-inner">
        <img class="logo-mark" src="images/techstore-mark.png" alt="" aria-hidden="true">
        <h2 class="wordmark">Tech<span>Store</span></h2>
      <p class="brand-copy">Crie sua conta em poucos segundos e acompanhe pedidos, ofertas exclusivas e o histórico da sua loja.</p>
    </div>

    <div class="brand-foot">
      <div><b>+40 mil</b> clientes ativos</div>
      <div><b>4.9/5</b> em avaliações</div>
      <div>Servido por <b id="instance">…</b></div>
    </div>
  </section>

  <section class="stage">
    <div class="card">
      <h1>Criar conta</h1>
      <p class="lead">Preencha seus dados para começar na TechStore.</p>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="nome">Nome</label>
          <div class="control">
            <input id="nome" name="nome" type="text" placeholder="Seu nome" autocomplete="name" required>
          </div>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <div class="control">
            <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>
          </div>
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <div class="control">
            <input id="senha" name="senha" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" minlength="6" required>
          </div>
        </div>

        <div class="field">
          <label for="confirmar">Confirmar senha</label>
          <div class="control">
            <input id="confirmar" name="confirmar" type="password" placeholder="Repita a senha" autocomplete="new-password" required>
          </div>
        </div>

        <button type="submit" class="submit" id="submitBtn">Criar conta</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

      <p class="divider-sub">Já tem uma conta? <a href="index.html">Entrar</a></p>
    </div>
  </section>

</div>

<script src="js/api.js"></script>
<script src="js/cadastro.js"></script>
</body>
</html>
